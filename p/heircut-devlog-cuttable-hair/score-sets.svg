<text x="584.0" y="171.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" >G − H₀</text>
<text x="584.0" y="189.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >理想形超出头发的部分，不计分</text>
<rect x="560" y="203" width="16" height="14" rx="3" fill="#e34948"/>
<text x="584.0" y="215.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" >X ∩ K</text>
<text x="584.0" y="233.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >剪掉了不该剪的：误剪</text>
<rect x="560.5" y="247.5" width="15" height="13" rx="3" fill="none" stroke="#8a897f" stroke-dasharray="3 2"/>
<text x="584.0" y="259.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" >X ∩ R</text>
<text x="584.0" y="277.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >剪对了的部分（已掉落）</text>
<line x1="560" x2="576" y1="298" y2="298" stroke="#52514e" stroke-width="1.6"/>
