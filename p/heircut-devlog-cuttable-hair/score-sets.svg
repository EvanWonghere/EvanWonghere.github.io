<text x="145.0" y="395.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600" >剪之前：记下基线</text>
<text x="435.0" y="395.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600" >剪了一刀之后</text>
<rect x="560" y="71" width="16" height="14" rx="3" fill="#f6c3ad"/>
<text x="584.0" y="83.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" >R = H₀ − G</text>
<text x="584.0" y="101.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >应该剪掉的部分</text>
<rect x="560" y="115" width="16" height="14" rx="3" fill="#b9d3f2"/>
<text x="584.0" y="127.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" >K = H₀ ∩ G</text>
