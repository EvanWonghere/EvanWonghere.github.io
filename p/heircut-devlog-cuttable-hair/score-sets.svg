<text x="584.0" y="321.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >初始头发轮廓</text>
<line x1="560" x2="576" y1="342" y2="342" stroke="#4a3aa7" stroke-width="1.8" stroke-dasharray="5 2"/>
<text x="584.0" y="347.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" >G</text>
<text x="584.0" y="365.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >美术画的理想形状</text>
<text x="40.0" y="430.0" font-size="12" fill="#8a897f" text-anchor="start" font-weight="normal" >C：当前头发；X = H₀ − C：已经剪掉的部分</text>
