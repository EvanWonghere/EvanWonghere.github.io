<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif" role="img" aria-label="换进去的词如何影响结局">
<title>换进去的词如何影响结局</title>
<rect x="0.5" y="0.5" width="819" height="329" rx="12" fill="#fcfcfb" stroke="#e6e5e0"/>
<text x="24.0" y="32.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600" >换进去的词，只有一条路通向结局</text>
<rect x="24" y="62" width="170" height="92" rx="8" fill="#ffffff" stroke="#e6e5e0"/>
<rect x="24" y="62" width="4" height="92" rx="2" fill="#1baf7a"/>
<text x="38.0" y="84.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600" >换词</text>
<text x="38.0" y="104.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >「把婚约撕个粉碎」</text>
<text x="38.0" y="122.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >换进国王的「誓词」槽</text>
<line x1="196" y1="108.0" x2="218" y2="108.0" stroke="#8a897f" stroke-width="1.5"/>
<path d="M210.8 111.5 L218 108.0 L210.8 104.5" fill="none" stroke="#8a897f" stroke-width="1.5"/>
<rect x="220" y="62" width="170" height="92" rx="8" fill="#ffffff" stroke="#e6e5e0"/>
<rect x="220" y="62" width="4" height="92" rx="2" fill="#2a78d6"/>
<text x="234.0" y="84.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600" >打勾</text>
<text x="234.0" y="104.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >这个候选在表里</text>
<text x="234.0" y="122.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >标成「会打勾」</text>
<line x1="392" y1="108.0" x2="414" y2="108.0" stroke="#8a897f" stroke-width="1.5"/>
<path d="M406.8 111.5 L414 108.0 L406.8 104.5" fill="none" stroke="#8a897f" stroke-width="1.5"/>
<rect x="416" y="62" width="170" height="92" rx="8" fill="#ffffff" stroke="#e6e5e0"/>
<rect x="416" y="62" width="4" height="92" rx="2" fill="#2a78d6"/>
<text x="430.0" y="84.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600" >账本 → 故事事实</text>
<text x="430.0" y="104.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >账本投影成故事事实：</text>
<text x="430.0" y="122.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >「要撕毁婚约」</text>
<line x1="588" y1="108.0" x2="610" y2="108.0" stroke="#8a897f" stroke-width="1.5"/>
<path d="M602.8 111.5 L610 108.0 L602.8 104.5" fill="none" stroke="#8a897f" stroke-width="1.5"/>
<rect x="612" y="62" width="170" height="92" rx="8" fill="#ffffff" stroke="#e6e5e0"/>
<rect x="612" y="62" width="4" height="92" rx="2" fill="#4a3aa7"/>
<text x="626.0" y="84.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600" >当天结算</text>
<text x="626.0" y="104.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >只读故事事实，</text>
<text x="626.0" y="122.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >决定下一天或结局</text>
<rect x="220" y="210" width="330" height="76" rx="8" fill="#fbfaf7" stroke="#e6e5e0"/>
<rect x="220" y="210" width="4" height="76" rx="2" fill="#8a897f"/>
<text x="234.0" y="232.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600" >会面里的「设置事实」</text>
<text x="234.0" y="252.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >只在这次会面里有效，会面结束就丢了</text>
<line x1="550" y1="248" x2="700" y2="248" stroke="#8a897f" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="700" y1="248" x2="700" y2="160" stroke="#8a897f" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M692 172 L708 156 M692 156 L708 172" stroke="#e34948" stroke-width="2.2"/>
<text x="712.0" y="214.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" >结算看不到</text>
<text x="24.0" y="312.0" font-size="12" fill="#8a897f" text-anchor="start" font-weight="normal" >换词还能影响客人接下来说什么、播哪段演出，但这些都留在会面内部。</text>
</svg>