name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # 与本地开发环境保持一致（brew 安装的 hugo 0.165.0）。
          # 两边版本不同意味着线上构建用的是从未在本地验证过的版本。
          # 升级时请两边同时改：brew upgrade hugo，然后同步此处版本号。
          hugo-version: "0.165.0"
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: yufenghuang.tech
