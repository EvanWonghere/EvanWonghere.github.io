<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>恐龙快跑 · Dino Run</title>
    <style>
        :root {
            --bg-color: #f7f7f7;
            --text-color: #535353;
            --accent: #535353;
            --font: 'Courier New', Courier, monospace;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            transition: background 0.5s, color 0.5s;
            touch-action: none;
            user-select: none;
        }

        /* 霓虹主题 */
        body.theme-neon {
            --bg-color: #0a0a0a;
            --text-color: #00ffcc;
            --accent: #ff00ff;
        }
        body.theme-neon canvas {
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            border: 1px solid #333;
        }

        .header {
            position: absolute; top: 20px; width: 100%;
            display: flex; justify-content: center; gap: 20px;
            z-index: 10;
        }

        .btn {
            background: transparent;
            border: 2px solid var(--text-color);
            color: var(--text-color);
            padding: 5px 15px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .btn:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        canvas {
            display: block;
            width: 100%;
            max-width: 800px;
            height: 300px;
            border-bottom: 2px solid var(--text-color);
        }

        #overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        #overlay.hidden { display: none; }
        
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .blink { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        @media (max-width: 600px) {
            canvas { height: 250px; }
        }
    </style>
    <script src="/games/arcade-runtime.js"></script>
</head>
<body class="theme-classic">

    <div class="header">
        <button class="btn" onclick="toggleTheme()">切换昼夜</button>
        <div style="font-size: 1.5rem; font-weight: bold;" id="score">00000</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="overlay">
        <h1 id="msg">PRESS SPACE</h1>
        <p class="blink">Tap to Jump</p>
    </div>

<script type="text/plain" data-legacy-script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');
    const msg = document.getElementById('msg');

    // 配置
    let theme = 'classic';
    let gameRunning = false;
    let gameSpeed = 6;
    let score = 0;
    let frame = 0;
    let highScore = localStorage.getItem('dino_best') || 0;

    // 实体
    const dino = {
        x: 50, y: 0, w: 40, h: 40,
        dy: 0, jumpForce: 12, gravity: 0.6,
        grounded: false, ducking: false,
        legFrame: 0 // 跑步动画帧
    };
    
    let obstacles = []; // {type: 'cactus'|'bird', x, y, w, h}
    let clouds = [];

    function resize() {
        // 固定逻辑分辨率，视觉上拉伸
        canvas.width = 800;
        canvas.height = 300;
        dino.groundY = canvas.height - 20;
    }
    window.addEventListener('resize', resize);
    resize();

    function toggleTheme() {
        if (theme === 'classic') {
            theme = 'neon';
            document.body.className = 'theme-neon';
        } else {
            theme = 'classic';
            document.body.className = 'theme-classic';
        }
        draw(); // 重绘静态画面
    }

    function initGame() {
        obstacles = [];
        clouds = [];
        score = 0;
        gameSpeed = 6;
        dino.y = dino.groundY - dino.h;
        dino.dy = 0;
        gameRunning = true;
        overlay.classList.add('hidden');
        requestAnimationFrame(loop);
    }

    function jump() {
        if (!gameRunning) {
            initGame();
            return;
        }
        if (dino.grounded) {
            dino.dy = -dino.jumpForce;
            dino.grounded = false;
        }
    }

    function duck(isDown) {
        if (!gameRunning) return;
        if (isDown) {
            if (!dino.ducking) {
                dino.h = 20; // 变矮
                dino.y += 20;
                dino.ducking = true;
                dino.dy += 5; // 快速下坠
            }
        } else {
            if (dino.ducking) {
                dino.y -= 20;
                dino.h = 40; // 恢复
                dino.ducking = false;
            }
        }
    }

    // 输入
    document.addEventListener('keydown', e => {
        if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
        if (e.code === 'ArrowDown') { e.preventDefault(); duck(true); }
    });
    document.addEventListener('keyup', e => {
        if (e.code === 'ArrowDown') duck(false);
    });
    document.addEventListener('touchstart', e => {
        e.preventDefault();
        jump(); // 移动端简化为点击跳跃
    }, {passive: false});

    function loop() {
        if (!gameRunning) return;

        update();
        draw();
        requestAnimationFrame(loop);
    }

    function update() {
        frame++;
        score++;
        scoreEl.innerText = Math.floor(score/5).toString().padStart(5, '0');
        
        // 加速
        if (score % 500 === 0) gameSpeed += 0.5;

        // Dino 物理
        dino.y += dino.dy;
        if (dino.y < dino.groundY - dino.h) {
            dino.dy += dino.gravity;
            dino.grounded = false;
        } else {
            dino.y = dino.groundY - dino.h;
            dino.dy = 0;
            dino.grounded = true;
        }

        // 跑步动画
        if (frame % 5 === 0) dino.legFrame = !dino.legFrame;

        // 生成障碍物
        if (frame % 100 === 0) { // 基础生成率
            if (Math.random() < 0.5) spawnObstacle();
        }
        // 随机额外生成
        if (Math.random() < 0.01) spawnObstacle();

        // 障碍物移动与碰撞
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= gameSpeed;

            // 碰撞检测 (AABB)
            // 缩小一点 hitbox 增加容错
            if (
                dino.x < obs.x + obs.w - 5 &&
                dino.x + dino.w - 5 > obs.x &&
                dino.y < obs.y + obs.h - 5 &&
                dino.y + dino.h - 5 > obs.y
            ) {
                gameOver();
            }

            if (obs.x + obs.w < 0) obstacles.splice(i, 1);
        }
        
        // 简单的防重叠逻辑
        // (实际代码中应检查最后一个障碍物的距离)
        
        // 云朵
        if (frame % 150 === 0) {
            clouds.push({x: canvas.width, y: Math.random()*100, w: 40});
        }
        clouds.forEach(c => c.x -= gameSpeed * 0.2);
        clouds = clouds.filter(c => c.x + c.w > -50);
    }

    function spawnObstacle() {
        // 确保距离够远
        if (obstacles.length > 0) {
            let last = obstacles[obstacles.length-1];
            if (800 - last.x < 250) return; // 最小间距
        }

        let type = Math.random();
        if (type < 0.2 && score > 500) { 
            // 翼龙 (飞)
            let height = Math.random() < 0.5 ? 50 : 10; // 高飞或低飞
            obstacles.push({ type: 'bird', x: 800, y: dino.groundY - 40 - height, w: 40, h: 30 });
        } else {
            // 仙人掌 (地)
            let w = Math.random() < 0.5 ? 20 : 45; // 单个或多个
            let h = Math.random() < 0.5 ? 35 : 50; // 大或小
            obstacles.push({ type: 'cactus', x: 800, y: dino.groundY - h, w: w, h: h });
        }
    }

    function gameOver() {
        gameRunning = false;
        if (Math.floor(score/5) > highScore) {
            highScore = Math.floor(score/5);
            localStorage.setItem('dino_best', highScore);
        }
        msg.innerText = "GAME OVER";
        overlay.classList.remove('hidden');
    }

    // --- 绘制系统 (像素风模拟) ---
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const color = theme === 'neon' ? '#00ffcc' : '#535353';
        const accent = theme === 'neon' ? '#ff00ff' : '#535353';
        
        ctx.fillStyle = color;
        ctx.strokeStyle = color;

        // 地面
        ctx.beginPath();
        ctx.moveTo(0, dino.groundY);
        ctx.lineTo(canvas.width, dino.groundY);
        ctx.lineWidth = 2;
        ctx.stroke();

        // 云朵
        clouds.forEach(c => {
            ctx.globalAlpha = 0.5;
            ctx.fillRect(c.x, c.y, c.w, 10);
            ctx.fillRect(c.x+10, c.y-10, c.w-10, 10);
            ctx.globalAlpha = 1;
        });

        // 恐龙
        if (theme === 'classic') {
            // 简单的像素块模拟恐龙
            ctx.fillRect(dino.x, dino.y, dino.w, dino.h);
            // 眼睛
            ctx.fillStyle = '#fff';
            ctx.fillRect(dino.x + 25, dino.y + 5, 5, 5);
            ctx.fillStyle = color;
            // 腿
            if (dino.grounded) {
                if (dino.legFrame) ctx.clearRect(dino.x, dino.y + dino.h - 5, 15, 5);
                else ctx.clearRect(dino.x + 25, dino.y + dino.h - 5, 15, 5);
            }
        } else {
            // Neon 风格：线框
            ctx.shadowBlur = 10; ctx.shadowColor = color;
            ctx.strokeRect(dino.x, dino.y, dino.w, dino.h);
            ctx.beginPath();
            ctx.moveTo(dino.x, dino.y); ctx.lineTo(dino.x+dino.w, dino.y+dino.h);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        // 障碍物
        obstacles.forEach(o => {
            if (o.type === 'cactus') {
                ctx.fillStyle = accent;
                if (theme === 'neon') {
                    ctx.shadowBlur = 10; ctx.shadowColor = accent;
                    ctx.strokeRect(o.x, o.y, o.w, o.h);
                } else {
                    // 经典仙人掌画法 (简单的柱子)
                    ctx.fillRect(o.x + o.w/3, o.y, o.w/3, o.h); // 主干
                    ctx.fillRect(o.x, o.y + 10, o.w, 10); // 分叉
                }
                ctx.shadowBlur = 0;
            } else {
                // 翼龙
                ctx.fillStyle = color;
                let wingY = (frame % 20 < 10) ? 0 : 10;
                ctx.fillRect(o.x, o.y + 10, o.w, 10); // 身体
                ctx.fillRect(o.x + 10, o.y + wingY, 10, 10); // 翅膀
            }
        });
        
        // 恢复颜色
        ctx.fillStyle = color;
    }
    
    // 初始画面
    draw();

</script>
<script src="game.js"></script>
</body>
</html>
