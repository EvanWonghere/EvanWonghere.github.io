<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>数织 · Pixel Atelier</title>
    <style>
        :root { color-scheme:dark; --night:#080d18; --surface:#121b2c; --surface2:#19263b; --line:#53627a; --strong:#b7c5d8; --ink:#f4f8ff; --muted:#8290a8; --mint:#63e6c4; --mint2:#20aa8c; --coral:#ff7889; --violet:#8d9cff; }
        * { box-sizing:border-box; }
        html,body { margin:0; min-height:100%; overflow:hidden; }
        body { min-height:100vh; color:var(--ink); font:500 14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; user-select:none; background:radial-gradient(circle at 50% -25%,#344563 0,#121b2b 39%,var(--night) 100%); }
        body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.22; background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px); background-size:24px 24px; mask-image:linear-gradient(to bottom,#000,transparent 78%); }
        button { font:inherit; color:inherit; }
        .app { position:relative; height:100vh; display:grid; grid-template-rows:auto auto auto minmax(0,1fr) auto; gap:8px; padding:10px clamp(8px,2vw,18px); }
        header { display:flex; align-items:center; justify-content:space-between; gap:14px; width:min(920px,100%); margin:auto; }
        .brand { display:flex; align-items:center; gap:10px; min-width:0; }
        .brand-mark { width:38px; aspect-ratio:1; display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:7px; border:1px solid #5c6d87; border-radius:12px; background:linear-gradient(145deg,#24334c,#101827); box-shadow:0 8px 24px #0007,inset 0 1px #ffffff16; }
        .brand-mark i { border-radius:2px; background:#34435b; }
        .brand-mark i:nth-child(1),.brand-mark i:nth-child(5),.brand-mark i:nth-child(7),.brand-mark i:nth-child(9) { background:var(--mint); box-shadow:0 0 8px #63e6c477; }
        h1 { margin:0; font-size:clamp(18px,3vw,25px); letter-spacing:.04em; line-height:1.05; }
        h1 span { display:block; margin-top:4px; color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; }
        .stats { display:flex; gap:7px; }
        .stat { min-width:70px; padding:6px 10px; border:1px solid #34425a; border-radius:11px; background:#0d1422c9; text-align:center; box-shadow:inset 0 1px #ffffff0d; }
        .stat small { display:block; color:var(--muted); font-size:9px; letter-spacing:.13em; }
        .stat strong { color:#fff; font-size:14px; font-variant-numeric:tabular-nums; }
        .difficulty-panel { width:min(760px,100%); margin:auto; display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:8px; padding:7px; border:1px solid #33415a; border-radius:15px; background:linear-gradient(180deg,#18243aee,#101827ee); box-shadow:0 12px 35px #02050b66,inset 0 1px #ffffff12; }
        .panel-label { padding:0 7px; color:var(--muted); font-size:10px; letter-spacing:.12em; text-align:center; }
        .panel-label strong { display:block; color:var(--ink); font-size:12px; letter-spacing:.04em; }
        #pool-count { white-space:nowrap; }
        .difficulty-tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; padding:4px; border-radius:11px; background:#080e19aa; box-shadow:inset 0 1px 4px #000a; }
        .difficulty { min-width:0; border:1px solid transparent; border-radius:8px; background:transparent; padding:5px 8px; cursor:pointer; transition:.16s ease; }
        .difficulty strong,.difficulty small { display:block; }
        .difficulty strong { font-size:12px; }
        .difficulty small { color:#73819a; font-size:9px; }
        .difficulty:hover { background:#ffffff08; }
        .difficulty.active { border-color:#69e6c455; color:#081b18; background:linear-gradient(135deg,#82efd4,var(--mint)); box-shadow:0 5px 16px #28b69933,inset 0 1px #fff8; }
        .difficulty.active small { color:#22685c; }
        .random-button { height:44px; border:1px solid #7f8dff66; border-radius:10px; padding:0 14px; cursor:pointer; font-weight:750; background:linear-gradient(145deg,#6474df,#4555b8); box-shadow:0 7px 18px #26348a55,inset 0 1px #ffffff33; }
        .random-button:hover { filter:brightness(1.1); transform:translateY(-1px); }
        .random-button span { display:inline-block; margin-right:5px; font-size:18px; vertical-align:-1px; }
        .utility-bar { width:min(760px,100%); margin:auto; display:flex; align-items:center; justify-content:space-between; gap:8px; }
        #puzzle-code { color:#9dabbe; font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
        .utility-actions { display:flex; gap:5px; }
        .icon-btn { min-height:31px; border:1px solid #36445c; border-radius:8px; padding:5px 10px; cursor:pointer; color:#c7d1e0; background:#111a2a99; box-shadow:inset 0 1px #ffffff0a; }
        .icon-btn b { margin-right:3px; color:#eef3fb; font-size:15px; }
        .icon-btn:hover:not(:disabled) { color:#fff; border-color:#7185a6; background:#1c293f; }
        .icon-btn:disabled { opacity:.3; cursor:not-allowed; }
        .board-wrap { min-height:0; display:grid; place-items:center; overflow:auto; padding:4px; }
        #board { display:grid; background:var(--line); border:3px solid #c2cede; border-radius:9px; overflow:hidden; box-shadow:0 22px 55px #01040a99,0 0 0 7px #111a29,0 0 0 8px #3b4a63; touch-action:none; }
        .corner,.clue,.cell { border:0; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
        .corner { position:relative; background:linear-gradient(135deg,#26354e 49%,#66758d 50%,#18243a 51%); color:#90a0b7; font-size:9px; }
        .corner span:first-child { position:absolute; right:8px; top:7px; }
        .corner span:last-child { position:absolute; left:8px; bottom:7px; }
        .clue { display:flex; color:#dfe7f3; font-weight:800; background:linear-gradient(145deg,#26344b,#1b273b); transition:.12s; }
        .clue span { min-width:1.3em; text-align:center; }
        .clue-row { align-items:center; justify-content:flex-end; gap:2px; padding:0 7px; }
        .clue-col { flex-direction:column; align-items:center; justify-content:flex-end; gap:0; padding:5px 0; }
        .clue.line-active { color:white; background:linear-gradient(145deg,#40516f,#293752); text-shadow:0 0 9px #fff5; }
        .clue.solved { color:#5b6b80; background:#151f30; }
        .clue.solved span { text-decoration:line-through 2px; }
        .cell { width:var(--cell); height:var(--cell); padding:0; position:relative; cursor:crosshair; background:linear-gradient(145deg,#f8fafc,#dce3ea); transition:background .07s,box-shadow .07s; }
        .cell.line-active { background:linear-gradient(145deg,#edf4fa,#cedae5); }
        .cell.filled { background:linear-gradient(145deg,#86efd6 0%,var(--mint) 48%,var(--mint2) 100%); box-shadow:inset 0 0 0 2px #ffffff26,inset -4px -4px 9px #08765e36; }
        .cell.filled::after { content:""; position:absolute; inset:12%; border-radius:3px; background:linear-gradient(135deg,#ffffff2b,transparent 55%); }
        .cell.crossed::before,.cell.crossed::after { content:""; position:absolute; left:19%; right:19%; top:48%; height:2px; border-radius:2px; background:var(--coral); box-shadow:0 0 5px #ff788966; transform:rotate(45deg); }
        .cell.crossed::after { transform:rotate(-45deg); }
        .cell.active { z-index:2; box-shadow:inset 0 0 0 3px var(--violet),0 0 0 1px #fff,0 0 12px #697aff88; }
        .cell.group-right { border-right:3px solid var(--strong); }
        .cell.group-bottom { border-bottom:3px solid var(--strong); }
        .tools { width:min(560px,100%); margin:auto; display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:6px; border:1px solid #34425a; border-radius:14px; background:#0c1321dd; box-shadow:0 10px 28px #0008,inset 0 1px #ffffff10; }
        .tool { min-height:42px; border:1px solid transparent; border-radius:9px; cursor:pointer; color:#aeb9ca; font-weight:750; background:transparent; }
        .tool:hover { color:#fff; background:#ffffff09; }
        .tool.active { color:#09211c; border-color:#9df4df; background:linear-gradient(145deg,#8ef2da,var(--mint)); box-shadow:0 5px 16px #2ac3a22e,inset 0 1px #fff9; }
        .tool-icon { display:inline-grid; place-items:center; width:22px; height:22px; margin-right:5px; border-radius:6px; background:#ffffff14; vertical-align:-6px; }
        .shortcut { color:inherit; opacity:.62; font-size:9px; margin-left:4px; }
        #overlay { position:fixed; inset:0; display:none; place-items:center; z-index:20; background:#050912df; backdrop-filter:blur(10px); }
        #overlay.show { display:grid; animation:fade .25s ease; }
        .win-card { width:min(380px,calc(100vw - 28px)); padding:25px; border:1px solid #637391; border-radius:22px; background:radial-gradient(circle at 50% 0,#2b3d5c,#141f32 62%); text-align:center; box-shadow:0 30px 90px #000c,inset 0 1px #ffffff20; }
        .win-card h2 { margin:8px 0 2px; font-size:28px; color:var(--mint); }
        #win-name { margin:0 0 5px; color:white; font-size:18px; }
        .win-card p { margin:5px 0 18px; color:var(--muted); }
        #reveal { width:150px; aspect-ratio:1; display:grid; gap:1px; margin:0 auto 15px; padding:5px; border:1px solid #637391; border-radius:12px; overflow:hidden; background:#25334b; image-rendering:pixelated; box-shadow:0 12px 30px #0008; }
        #reveal span { background:#e8edf4; }
        #reveal .on { background:var(--mint); }
        @keyframes fade { from{opacity:0} }
        @media(max-width:620px){
            .app{padding:7px;gap:6px}.brand-mark{width:33px}.stat{min-width:58px;padding:4px 6px}.difficulty-panel{grid-template-columns:minmax(0,1fr) auto}.panel-label{display:none}.difficulty{padding:5px 3px}.random-button{width:44px;padding:0;font-size:0}.random-button span{margin:0;font-size:20px}.utility-bar{padding-inline:2px}.utility-bar>div:first-child{white-space:nowrap}#puzzle-code{display:none}.icon-btn{width:34px;padding:4px;font-size:0}.icon-btn b{margin:0;font-size:16px}.shortcut{display:none}.tool{font-size:12px}.tool-icon{margin-right:2px}#board{box-shadow:0 15px 40px #01040aaa,0 0 0 4px #111a29,0 0 0 5px #3b4a63}}
    </style>
    <script src="/games/arcade-runtime.js"></script>
</head>
<body>
<main class="app">
    <header>
        <div class="brand"><div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><h1>数织工坊<span>Pixel Atelier</span></h1></div>
        <div class="stats"><div class="stat"><small>时间</small><strong id="timer">00:00</strong></div><div class="stat"><small>填色</small><strong id="progress">0 / 0</strong></div></div>
    </header>
    <section class="difficulty-panel" aria-label="选择难度">
        <div class="panel-label"><strong>难度</strong><span id="pool-count">20 题</span></div>
        <div class="difficulty-tabs">
            <button class="difficulty active" type="button" data-difficulty="easy"><strong>轻松</strong><small>5 × 5</small></button>
            <button class="difficulty" type="button" data-difficulty="normal"><strong>标准</strong><small>10 × 10</small></button>
            <button class="difficulty" type="button" data-difficulty="hard"><strong>挑战</strong><small>15 × 15</small></button>
        </div>
        <button class="random-button" id="random-puzzle" type="button" title="随机新题"><span>↻</span>随机新题</button>
    </section>
    <div class="utility-bar"><div><strong id="puzzle-title">轻松 · 5×5</strong><span id="puzzle-code" style="margin-left:8px">随机谜题 01</span></div><div class="utility-actions"><button class="icon-btn" id="undo" type="button" title="撤销"><b>↶</b><span>撤销</span></button><button class="icon-btn" id="redo" type="button" title="重做"><b>↷</b><span>重做</span></button><button class="icon-btn" id="hint" type="button" title="提示一格"><b>✦</b><span>提示</span></button><button class="icon-btn" id="reset" type="button" title="清空当前棋盘"><b>⌫</b><span>重置</span></button></div></div>
    <div class="board-wrap"><div id="board" role="grid" aria-label="数织棋盘"></div></div>
    <div class="tools" role="toolbar" aria-label="绘制工具"><button class="tool active" type="button" data-tool="1"><span class="tool-icon">■</span>填色 <span class="shortcut">Space</span></button><button class="tool" type="button" data-tool="2"><span class="tool-icon">×</span>排除 <span class="shortcut">X</span></button><button class="tool" type="button" data-tool="0"><span class="tool-icon">◇</span>擦除 <span class="shortcut">Del</span></button></div>
</main>
<div id="overlay" role="dialog" aria-modal="true" aria-label="关卡完成"><div class="win-card"><div id="reveal"></div><h2>图案完成</h2><div id="win-name">隐藏图案</div><p>用时 <strong id="win-time">00:00</strong></p><button class="random-button" id="continue" type="button"><span>↻</span>同难度再来一题</button></div></div>
<script type="module" src="game.js"></script>
</body>
</html>
