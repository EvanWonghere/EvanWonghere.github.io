<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hive Words</title>
    <style>
        :root {
            --correct: #6aaa64;
            --present: #c9b458;
            --absent: #787c7e;
            --default-border: #d3d6da;
            --filled-border: #878a8c;
            --bg: #ffffff;
            --text: #000000;
            --key-bg: #d3d6da;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121213;
                --text: #ffffff;
                --default-border: #3a3a3c;
                --filled-border: #565758;
                --key-bg: #818384;
                
                /* 新增：深色模式下，错误字母显示为深炭色，与浅灰色的默认键盘区分开 */
                --absent: #3a3a3c; 
            }
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            flex-wrap: wrap;
            padding: 10px;
            border-bottom: 1px solid var(--default-border);
            width: 100%;
            gap: 10px;
        }

        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; }

        select {
            padding: 5px;
            font-size: 1rem;
            border-radius: 5px;
        }

        button.restart-btn {
            padding: 5px 10px;
            cursor: pointer;
            background: var(--correct);
            color: white;
            border: none;
            border-radius: 4px;
        }

        #game-board {
            display: grid;
            grid-gap: 5px;
            padding: 10px;
            box-sizing: border-box;
            flex-grow: 1;
            align-content: center;
            max-height: 65vh;
        }

        .tile {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 2px solid var(--default-border);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            text-transform: uppercase;
            user-select: none;
        }

        /* 动态调整格子大小，防止太小或太大 */
        @media (max-height: 600px) { .tile { font-size: 1.5rem; } }

        .tile[data-state='active'] { border-color: var(--filled-border); animation: pop 0.1s; }
        .tile[data-state='correct'] { background-color: var(--correct); border-color: var(--correct); color: white; }
        .tile[data-state='present'] { background-color: var(--present); border-color: var(--present); color: white; }
        .tile[data-state='absent'] { background-color: var(--absent); border-color: var(--absent); color: white; }
        
        /* 翻转动画 */
        .tile.flip { animation: flip 0.5s ease forwards; }

        @keyframes pop { 50% { transform: scale(1.1); } }
        @keyframes flip {
            0% { transform: rotateX(0); }
            50% { transform: rotateX(90deg); }
            100% { transform: rotateX(0); }
        }

        #keyboard {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding-bottom: 20px;
            width: 100%;
            max-width: 500px;
        }

        .keyboard-row { display: flex; gap: 6px; width: 95%; justify-content: center; }
        .key {
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            background-color: var(--key-bg);
            color: var(--text); /* 适配深色模式文字 */
            height: 58px;
            flex: 1;
            font-size: 1.2rem;
            user-select: none;
        }
        .key[data-key='Enter'], .key[data-key='Backspace'] { flex: 1.5; font-size: 0.8rem; }
        .key[data-state='correct'] { background-color: var(--correct); color: white; }
        .key[data-state='present'] { background-color: var(--present); color: white; }
        .key[data-state='absent'] { background-color: var(--absent); color: white; }

        #message-container {
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }
        .message {
            background-color: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            opacity: 1;
            transition: opacity 0.5s;
        }

        .loading { opacity: 0.5; pointer-events: none; }
    </style>
    <script src="/games/arcade-runtime.js"></script>
</head>
<body>

<header>
    <select id="length-selector">
        <option value="3">3 字母</option>
        <option value="4">4 字母</option>
        <option value="5" selected>5 字母</option>
        <option value="6">6 字母</option>
        <option value="7">7 字母</option>
    </select>
    <h1>HIVE WORDS</h1>
    <select id="mode-selector" aria-label="游戏模式">
        <option value="daily" selected>每日</option>
        <option value="random">随机</option>
    </select>
    <button class="restart-btn" onclick="startNewGameRound(true)">重置</button>
</header>

<div id="message-container"></div>

<div id="game-board"></div>

<div id="keyboard">
    <div class="keyboard-row" id="row-1"></div>
    <div class="keyboard-row" id="row-2"></div>
    <div class="keyboard-row" id="row-3"></div>
</div>

<script>
    // --- 配置区 ---
    const KEYS = [
        ['q','w','e','r','t','y','u','i','o','p'],
        ['a','s','d','f','g','h','j','k','l'],
        ['Enter','z','x','c','v','b','n','m','Backspace']
    ];
    
    let TARGET_WORDS = {
        3: ["cat", "dog", "sun", "run", "sky"],
        4: ["book", "love", "hope", "code", "data"],
        5: ["apple", "world", "hello", "smile", "happy"],
        6: ["planet", "friend", "banana", "orange", "guitar"],
        7: ["freedom", "journey", "history", "mystery", "silence"]
    };
    const ALLOWED_WORDS = { 3: new Set(), 4: new Set(), 5: new Set(), 6: new Set(), 7: new Set() };
    const runtime = window.ArcadeRuntime;

    let wordLength = 5;
    let maxGuesses = 6; 
    let currentTarget = "";
    let currentRow = 0;
    let currentTile = 0;
    let isGameOver = false;
    let isLoading = false; 
    let guesses = []; 
    
    // 游戏实例 ID
    let currentGameId = 0; 

    // --- 初始化 ---
    const board = document.getElementById('game-board');
    const lengthSelector = document.getElementById('length-selector');
    const modeSelector = document.getElementById('mode-selector');

    // 监听长度变化
    lengthSelector.addEventListener('change', (e) => {
        wordLength = parseInt(e.target.value);
        e.target.blur(); // 移出焦点
        startNewGameRound(); 
    });
    modeSelector.addEventListener('change', () => startNewGameRound(false));

    // 加载词库
    async function loadWordsAndStart() {
        showMessage("正在加载词库...", 0);
        const msgContainer = document.getElementById('message-container');
        
        try {
            const response = await fetch('./words.txt');
            if (!response.ok) throw new Error("Network response was not ok");
            const text = await response.text();
            const allWords = text.split('\n')
                .map(w => w.trim().toLowerCase())
                .filter(w => w && /^[a-z]+$/.test(w));

            const newWordList = { 3: [], 4: [], 5: [], 6: [], 7: [] };
            let count = 0;
            allWords.forEach(word => {
                const len = word.length;
                if (newWordList[len]) {
                    ALLOWED_WORDS[len].add(word);
                    if (newWordList[len].length < 400) newWordList[len].push(word);
                    count++;
                }
            });

            msgContainer.innerHTML = ''; 
            if (count > 0) {
                Object.keys(TARGET_WORDS).forEach(length => {
                    TARGET_WORDS[length].forEach(word => ALLOWED_WORDS[length].add(word));
                    TARGET_WORDS[length] = Array.from(new Set([...TARGET_WORDS[length], ...newWordList[length]]));
                });
                showMessage("词库加载完成！", 1000);
            } else {
                showMessage("词库为空，使用默认词库", 2000);
            }
        } catch (error) {
            console.error("加载 words.txt 失败:", error);
            msgContainer.innerHTML = ''; 
            showMessage("词库加载失败，使用默认词库", 2000);
        }

        createKeyboard();
        startNewGameRound(false);
    }

    function startNewGameRound(forceNew = false) {
        // 🔥 关键修复 1：强制让当前获得焦点的元素（比如重置按钮）失去焦点
        // 这样按下 Enter 就不会再次触发它了
        if (document.activeElement instanceof HTMLElement) {
            document.activeElement.blur();
        }

        if (!TARGET_WORDS[wordLength] || TARGET_WORDS[wordLength].length === 0) {
            alert(`抱歉，词库中没有长度为 ${wordLength} 的单词！`);
            return;
        }
        initGame(forceNew);
    }

    // 创建键盘
    function createKeyboard() {
        const rows = ['row-1', 'row-2', 'row-3'];
        rows.forEach((rowId, index) => {
            const rowEl = document.getElementById(rowId);
            rowEl.innerHTML = '';
            KEYS[index].forEach(key => {
                const button = document.createElement('div');
                button.textContent = key === 'Backspace' ? '⌫' : key;
                button.classList.add('key');
                button.setAttribute('data-key', key);
                button.addEventListener('click', (e) => {
                    e.target.blur(); // 点击虚拟键盘也要移出焦点
                    handleInput(key);
                });
                rowEl.appendChild(button);
            });
        });
    }

    function roundStateKey() {
        const day = new Date().toISOString().slice(0, 10);
        return `state.${modeSelector.value}.${wordLength}.${day}`;
    }

    function readSavedRound(forceNew) {
        if (!runtime) return null;
        const key = roundStateKey();
        if (forceNew) {
            runtime.remove(key);
            return null;
        }
        try {
            const saved = JSON.parse(runtime.get(key, 'null'));
            if (!saved || typeof saved.target !== 'string' || saved.target.length !== wordLength) return null;
            if (!Array.isArray(saved.guesses)) return null;
            saved.guesses = saved.guesses.filter(word =>
                typeof word === 'string' && word.length === wordLength && /^[a-z]+$/.test(word)
            ).slice(0, maxGuesses);
            return saved;
        } catch {
            runtime.remove(key);
            return null;
        }
    }

    function evaluateGuess(guessWord) {
        const targetChars = currentTarget.split('');
        const guessChars = guessWord.split('');
        const states = Array(wordLength).fill('absent');

        guessChars.forEach((char, i) => {
            if (char === targetChars[i]) {
                states[i] = 'correct';
                targetChars[i] = null;
                guessChars[i] = null;
            }
        });
        guessChars.forEach((char, i) => {
            if (char !== null && targetChars.includes(char)) {
                states[i] = 'present';
                targetChars[targetChars.indexOf(char)] = null;
            }
        });
        return states;
    }

    function updateKeyboardState(character, state) {
        const keyEl = document.querySelector(`.key[data-key="${character}"]`);
        if (!keyEl) return;
        const oldState = keyEl.getAttribute('data-state');
        if (state === 'correct' ||
            (state === 'present' && oldState !== 'correct') ||
            (state === 'absent' && oldState !== 'correct' && oldState !== 'present')) {
            keyEl.setAttribute('data-state', state);
        }
    }

    function restoreRound(saved) {
        saved.guesses.forEach((word, rowIndex) => {
            guesses[rowIndex] = word.split('');
            const states = evaluateGuess(word);
            states.forEach((state, columnIndex) => {
                const tile = document.getElementById(`tile-${rowIndex}-${columnIndex}`);
                tile.textContent = word[columnIndex];
                tile.setAttribute('data-state', state);
                updateKeyboardState(word[columnIndex], state);
            });
        });
        isGameOver = Boolean(saved.gameOver);
        currentRow = isGameOver
            ? Math.max(0, saved.guesses.length - 1)
            : Math.min(saved.guesses.length, maxGuesses - 1);
        currentTile = 0;
        if (isGameOver) {
            const won = saved.guesses.some(word => word === currentTarget);
            showMessage(won ? '已恢复：本局已完成' : `已恢复：答案是 ${currentTarget.toUpperCase()}`, -1);
        }
    }

    function initGame(forceNew = false) {
        currentGameId++;

        maxGuesses = wordLength + 1;
        currentRow = 0;
        currentTile = 0;
        isGameOver = false;
        isLoading = false; 
        document.body.classList.remove('loading'); 
        guesses = Array(maxGuesses).fill(null).map(() => Array(wordLength).fill(''));
        
        board.innerHTML = '';
        document.getElementById('message-container').innerHTML = ''; 
        document.querySelectorAll('.key').forEach(k => k.removeAttribute('data-state')); 
        
        const list = TARGET_WORDS[wordLength];
        const saved = readSavedRound(forceNew);
        if (saved) {
            currentTarget = saved.target.toLowerCase();
        } else if (modeSelector.value === 'daily') {
            const day = new Date().toISOString().slice(0, 10);
            let hash = wordLength * 2166136261;
            for (const char of day) hash = Math.imul(hash ^ char.charCodeAt(0), 16777619) >>> 0;
            currentTarget = list[hash % list.length].toLowerCase();
        } else {
            currentTarget = list[Math.floor(Math.random() * list.length)].toLowerCase();
        }

        board.style.gridTemplateColumns = `repeat(${wordLength}, 1fr)`;
        board.style.width = `${wordLength * 60}px`; 
        board.style.maxWidth = '95%';

        for (let i = 0; i < maxGuesses * wordLength; i++) {
            const tile = document.createElement('div');
            tile.classList.add('tile');
            tile.id = `tile-${Math.floor(i / wordLength)}-${i % wordLength}`;
            board.appendChild(tile);
        }

        if (saved) restoreRound(saved);
    }

    function handleInput(key) {
        if (isGameOver || isLoading) return;

        if (key === 'Backspace') {
            if (currentTile > 0) {
                currentTile--;
                const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
                if(tile) {
                    tile.textContent = '';
                    tile.removeAttribute('data-state');
                    guesses[currentRow][currentTile] = '';
                }
            }
        } else if (key === 'Enter') {
            if (currentTile === wordLength) {
                checkGuess();
            } else {
                showMessage('单词长度不够');
                shakeRow();
            }
        } else {
            if (currentTile < wordLength && /^[a-z]$/i.test(key)) {
                const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
                if(tile) {
                    tile.textContent = key;
                    tile.setAttribute('data-state', 'active');
                    guesses[currentRow][currentTile] = key.toLowerCase();
                    currentTile++;
                }
            }
        }
    }

    // 🔥 关键修复 2：全局键盘监听优化
    document.addEventListener('keydown', (e) => {
        // 如果按下的是功能键组合，不处理
        if (e.ctrlKey || e.metaKey || e.altKey) return;

        let key = e.key;

        // 如果是 Enter 键，阻止默认行为（防止触发按钮点击）
        if (key === 'Enter') {
            e.preventDefault(); 
            handleInput(key);
            return;
        }
        
        // Backspace 也要防止浏览器后退（虽然现代浏览器很少默认后退了，但以防万一）
        if (key === 'Backspace') {
            handleInput(key);
            return;
        }

        if (/^[a-zA-Z]$/.test(key)) {
            handleInput(key.toLowerCase());
        }
    });

    async function checkGuess() {
        const thisRoundId = currentGameId;
        const guessWord = guesses[currentRow].join('');
        
        isLoading = true;
        document.body.classList.add('loading');
        
        const isValid = validateWord(guessWord);
        
        if (thisRoundId !== currentGameId) return;

        document.body.classList.remove('loading');
        isLoading = false;

        if (!isValid) {
            showMessage('不是合法的单词');
            shakeRow();
            return;
        }

        flipTiles(guessWord, thisRoundId);
    }

    function validateWord(word) {
        return word === currentTarget || ALLOWED_WORDS[wordLength].has(word);
    }

    function flipTiles(guessWord, roundId) {
        const rowTiles = [];
        for (let i = 0; i < wordLength; i++) {
            rowTiles.push(document.getElementById(`tile-${currentRow}-${i}`));
        }

        const states = evaluateGuess(guessWord);

        rowTiles.forEach((tile, i) => {
            setTimeout(() => {
                if (roundId !== currentGameId) return;

                tile.classList.add('flip');
                tile.setAttribute('data-state', states[i]);
                
                updateKeyboardState(guesses[currentRow][i], states[i]);
            }, i * 250);
        });

        setTimeout(() => {
            if (roundId !== currentGameId) return;

            if (guessWord === currentTarget) {
                showMessage('🎉 恭喜你猜对了！', 2000);
                isGameOver = true;
            } else {
                if (currentRow >= maxGuesses - 1) {
                    showMessage(`游戏结束！答案是: ${currentTarget.toUpperCase()}`, -1); 
                    isGameOver = true;
                } else {
                    currentRow++;
                    currentTile = 0;
                }
            }
            if (runtime) {
                runtime.set(roundStateKey(), JSON.stringify({
                    target: currentTarget,
                    guesses: guesses.map(row => row.join('')).filter(word => word.length === wordLength),
                    gameOver: isGameOver
                }));
            }
        }, wordLength * 250);
    }

    function showMessage(text, duration = 1000) {
        const msgContainer = document.getElementById('message-container');
        const msg = document.createElement('div');
        msg.classList.add('message');
        msg.textContent = text;
        msgContainer.appendChild(msg);
        
        if (duration > 0) {
            setTimeout(() => {
                if (msg.parentNode === msgContainer) {
                    msg.style.opacity = 0;
                    setTimeout(() => {
                        if (msg.parentNode === msgContainer) msgContainer.removeChild(msg);
                    }, 500);
                }
            }, duration);
        }
    }

    function shakeRow() {
        const rowTiles = [];
        for (let i = 0; i < wordLength; i++) {
            const tile = document.getElementById(`tile-${currentRow}-${i}`);
            if(tile) {
                tile.style.animation = 'shake 0.5s';
                tile.addEventListener('animationend', () => tile.style.animation = '', {once: true});
            }
        }
    }

    loadWordsAndStart(); 
</script>
<style>
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-5px); }
        40% { transform: translateX(5px); }
        60% { transform: translateX(-5px); }
        80% { transform: translateX(5px); }
    }
</style>
</body>
</html>
