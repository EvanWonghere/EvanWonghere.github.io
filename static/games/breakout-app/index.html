<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Breakout Prism · 棱镜打砖块</title>
    <style>
        :root { color-scheme:dark; --ink:#f8fbff; --muted:#7c8ba5; --cyan:#66f8ff; --pink:#ff4fd8; --gold:#ffd166; --panel:#101827e8; --line:#33415b; }
        * { box-sizing:border-box; }
        html,body { margin:0; width:100%; height:100%; overflow:hidden; }
        body { color:var(--ink); font:600 14px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; user-select:none; touch-action:none; background:radial-gradient(circle at 50% -10%,#243a61 0,#0d1423 43%,#050914 100%); }
        body[data-theme="candy"] { --cyan:#71d8d2; --pink:#ff718d; --gold:#ffc857; --panel:#fff7f4e8; --line:#e7a9b7; color:#4f3141; background:radial-gradient(circle at 50% 0,#fff8d6,#ffd9e2 48%,#cdeff0); }
        body[data-theme="retro"] { --cyan:#9cff57; --pink:#9cff57; --gold:#d8ff76; --panel:#07130bea; --line:#4e8f3d; background:#061008; }
        body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.3; background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px); background-size:28px 28px; mask-image:linear-gradient(#000,transparent 78%); }
        body[data-theme="retro"]::after { content:""; position:fixed; inset:0; z-index:20; pointer-events:none; opacity:.13; background:repeating-linear-gradient(0deg,#000 0 2px,transparent 2px 4px); }
        button { color:inherit; font:inherit; }
        .app { position:relative; height:100%; display:grid; grid-template-rows:auto minmax(0,1fr) auto; gap:10px; padding:10px clamp(8px,2vw,18px); }
        .topbar { width:min(760px,100%); margin:auto; display:flex; align-items:center; justify-content:space-between; gap:12px; }
        .brand { display:flex; align-items:center; gap:10px; min-width:0; }
        .prism { width:40px; aspect-ratio:1; position:relative; flex:none; border:1px solid #61718e; border-radius:12px; background:linear-gradient(145deg,#22324d,#0d1524); box-shadow:0 7px 22px #0008,inset 0 1px #fff2; }
        .prism::before { content:""; position:absolute; inset:9px; clip-path:polygon(50% 0,100% 92%,0 92%); background:conic-gradient(from 210deg,var(--cyan),var(--pink),var(--gold),var(--cyan)); filter:drop-shadow(0 0 7px var(--cyan)); }
        .brand h1 { margin:0; font-size:clamp(17px,3vw,24px); letter-spacing:.08em; line-height:1; }
        .brand h1 span { display:block; margin-top:5px; color:var(--muted); font-size:9px; letter-spacing:.22em; }
        .hud { display:flex; gap:6px; }
        .metric { min-width:61px; padding:5px 8px; border:1px solid var(--line); border-radius:10px; background:var(--panel); text-align:center; box-shadow:inset 0 1px #fff1; }
        .metric small { display:block; color:var(--muted); font-size:8px; letter-spacing:.14em; }
        .metric strong { color:var(--ink); font-size:14px; font-variant-numeric:tabular-nums; }
        .stage { min-height:0; display:grid; place-items:center; }
        .cabinet { position:relative; height:100%; max-height:760px; aspect-ratio:600/760; max-width:100%; border:1px solid #465675; border-radius:18px; padding:8px; overflow:hidden; background:linear-gradient(145deg,#1e2a42,#090f1d); box-shadow:0 26px 70px #000a,0 0 0 4px #0a101c,0 0 0 5px #26344e,inset 0 1px #fff2; }
        body[data-theme="candy"] .cabinet { background:linear-gradient(145deg,#fff,#ffd7df); border-color:#d58ca0; box-shadow:0 24px 55px #9b557044,0 0 0 4px #fff8,0 0 0 5px #e6a7b6; }
        body[data-theme="retro"] .cabinet { border-radius:2px; border-color:#73d14f; background:#061008; box-shadow:0 0 24px #64ff4544,0 0 0 4px #020703,0 0 0 5px #39762c; }
        canvas { display:block; width:100%; height:100%; border-radius:11px; background:#050913; touch-action:none; }
        body[data-theme="retro"] canvas { border-radius:0; image-rendering:pixelated; }
        .pause { position:absolute; right:18px; top:18px; width:38px; height:38px; border:1px solid #60708c; border-radius:10px; cursor:pointer; color:#dfe8f7; background:#0b1422bb; backdrop-filter:blur(8px); box-shadow:inset 0 1px #fff2; }
        .pause:hover { border-color:var(--cyan); color:var(--cyan); }
        .overlay { position:absolute; inset:8px; display:grid; place-items:center; z-index:5; border-radius:11px; background:linear-gradient(#060b15b8,#050811e8); backdrop-filter:blur(7px); transition:opacity .2s; }
        .overlay.hidden { opacity:0; pointer-events:none; }
        .menu { width:min(420px,calc(100% - 28px)); padding:24px; border:1px solid #53637f; border-radius:20px; background:radial-gradient(circle at 50% 0,#263957ee,#111a2bea 68%); text-align:center; box-shadow:0 24px 75px #000b,inset 0 1px #fff2; }
        body[data-theme="candy"] .menu { color:#513445; border-color:#e4a0b1; background:radial-gradient(circle at 50% 0,#fff,#fff2f3ed); }
        body[data-theme="retro"] .menu { border-radius:0; border-color:#6dcc4d; background:#07120bef; box-shadow:0 0 25px #59ff4133; }
        .eyebrow { margin:0 0 5px; color:var(--cyan); font-size:10px; letter-spacing:.24em; }
        .menu h2 { margin:0; font-size:clamp(29px,7vw,52px); line-height:.94; letter-spacing:.04em; text-shadow:0 0 24px #63f5ff44; }
        .menu h2 span { display:block; color:var(--pink); }
        .menu-copy { margin:12px auto 18px; max-width:290px; color:var(--muted); font-size:12px; }
        .difficulty { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; padding:5px; border-radius:12px; background:#050a13aa; }
        body[data-theme="candy"] .difficulty { background:#eac8d277; }
        .diff { min-width:0; padding:8px 4px; border:1px solid transparent; border-radius:8px; cursor:pointer; color:var(--muted); background:transparent; }
        .diff strong,.diff small { display:block; }
        .diff small { margin-top:2px; font-size:8px; opacity:.75; }
        .diff.active { color:#061418; border-color:#a4fff3; background:linear-gradient(135deg,#91f7dd,var(--cyan)); box-shadow:0 5px 18px #44e5df44,inset 0 1px #fff9; }
        .start { width:100%; margin-top:10px; padding:13px; border:1px solid #8e9cff; border-radius:11px; cursor:pointer; color:white; font-size:15px; letter-spacing:.08em; background:linear-gradient(135deg,#6b75ed,#974ed8); box-shadow:0 8px 22px #39288c66,inset 0 1px #fff5; }
        .start:hover { filter:brightness(1.12); transform:translateY(-1px); }
        .legend { margin-top:12px; display:flex; justify-content:center; flex-wrap:wrap; gap:8px; color:var(--muted); font-size:9px; }
        .legend b { color:var(--ink); }
        .bottombar { width:min(620px,100%); margin:auto; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:8px; }
        .themes { display:flex; gap:5px; padding:5px; border:1px solid var(--line); border-radius:12px; background:var(--panel); }
        .theme { flex:1; min-width:68px; padding:7px 10px; border:1px solid transparent; border-radius:8px; cursor:pointer; color:var(--muted); background:transparent; font-size:10px; letter-spacing:.08em; }
        .theme.active { color:var(--ink); border-color:#60718d; background:#ffffff0d; box-shadow:inset 0 1px #fff1; }
        .help { color:var(--muted); font-size:10px; text-align:right; }
        @media(max-width:620px){
            .app{gap:7px;padding:7px}.brand h1 span{display:none}.prism{width:34px}.metric{min-width:49px;padding:4px 5px}.metric:nth-child(2){display:none}.cabinet{padding:6px;border-radius:14px}.overlay{inset:6px}.menu{padding:18px}.bottombar{grid-template-columns:1fr}.help{display:none}.theme{padding:6px}.pause{right:14px;top:14px}.legend{gap:5px}.menu-copy{margin:9px auto 13px}}
    </style>
    <script src="/games/arcade-runtime.js"></script>
</head>
<body data-theme="neon">
<main class="app">
    <header class="topbar">
        <div class="brand"><div class="prism" aria-hidden="true"></div><h1>BREAKOUT PRISM<span>棱镜打砖块</span></h1></div>
        <div class="hud"><div class="metric"><small>得分</small><strong id="score">0</strong></div><div class="metric"><small>最高</small><strong id="best">0</strong></div><div class="metric"><small>关卡</small><strong id="level">1</strong></div><div class="metric"><small>生命</small><strong id="lives">3</strong></div></div>
    </header>
    <section class="stage"><div class="cabinet">
        <canvas id="game" width="600" height="760" aria-label="Breakout Prism 游戏画面"></canvas>
        <button class="pause" id="pause" type="button" aria-label="暂停或继续">Ⅱ</button>
        <div class="overlay" id="overlay"><div class="menu">
            <p class="eyebrow" id="eyebrow">ARCADE REFORGED</p>
            <h2 id="menu-title">BREAKOUT <span>PRISM</span></h2>
            <p class="menu-copy" id="menu-copy">控制棱镜挡板，击碎能量砖墙。每次开球都由你决定，角度比运气更重要。</p>
            <div class="difficulty" aria-label="选择难度"><button class="diff" type="button" data-difficulty="easy"><strong>轻松</strong><small>宽挡板 · 5 命</small></button><button class="diff active" type="button" data-difficulty="normal"><strong>标准</strong><small>经典节奏 · 3 命</small></button><button class="diff" type="button" data-difficulty="hard"><strong>挑战</strong><small>高速球 · 2 命</small></button></div>
            <button class="start" id="start" type="button">开始游戏</button>
            <div class="legend"><span><b>M</b> 多球</span><span><b>W</b> 扩展</span><span><b>F</b> 火球</span><span><b>L</b> 激光</span></div>
        </div></div>
    </div></section>
    <footer class="bottombar"><div class="themes" aria-label="选择视觉主题"><button class="theme active" data-theme="neon" type="button">NEON</button><button class="theme" data-theme="candy" type="button">CANDY</button><button class="theme" data-theme="retro" type="button">RETRO</button></div><div class="help">鼠标 / 触摸 / ← → 移动　空格发球　P 暂停</div></footer>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
