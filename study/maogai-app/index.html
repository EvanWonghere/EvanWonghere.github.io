<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛概自动读取题库系统</title>
    <script src="question_data.js"></script>
    <script src="/games/arcade-runtime.js"></script>

    <style>
        :root {
            --primary: #d9534f;
            --success: #5cb85c;
            --error: #d9534f;
            --bg: #f8f9fa;
        }
        body { font-family: "Microsoft YaHei", sans-serif; background: var(--bg); padding: 20px; line-height: 1.6; color:#333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        h1 { text-align: center; color: var(--primary); margin-bottom: 20px; }

        /* 状态提示 */
        #loading-msg { text-align: center; color: #666; padding: 50px; }
        #error-msg { text-align: center; color: var(--error); padding: 20px; display: none; border: 2px dashed var(--error); border-radius: 5px;}

        .control-bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }

        .question-card { margin-bottom: 25px; padding: 15px; border: 1px solid #e0e0e0; border-radius: 6px; background: #fff; transition: box-shadow 0.2s; }
        .question-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        .type-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; color: white; font-size: 12px; margin-right: 8px; vertical-align: 2px; }
        .tag-single { background-color: #5bc0de; }
        .tag-multi { background-color: #f0ad4e; }
        .tag-judge { background-color: #5cb85c; }

        .q-title { font-weight: bold; font-size: 16px; margin-bottom: 15px; }

        .option-item { margin: 8px 0; padding: 10px 15px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; display: flex; align-items: center; transition: background 0.2s; }
        .option-item:hover { background-color: #f5f5f5; }

        /* 选中/对错样式 */
        .option-item.selected { background-color: #e8f4fd; border-color: #2196F3; }
        .option-item.correct { background-color: #dff0d8; border-color: var(--success); color: #3c763d; font-weight: bold; }
        .option-item.wrong { background-color: #f2dede; border-color: var(--error); color: #a94442; }

        .btn { padding: 8px 20px; border-radius: 4px; border: none; cursor: pointer; font-size: 14px; outline: none; }
        .btn-refresh { background: var(--primary); color: white; }
        .btn-submit { background: #337ab7; color: white; margin-top: 10px; }

        .feedback { margin-top: 10px; padding: 10px; background: #fafafa; border-radius: 4px; display: none; font-size: 14px; }

        .score-board { position: fixed; bottom: 20px; right: 20px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.15); font-size: 14px; z-index: 100; display: none;}
    </style>
</head>
<body>

<div class="container">
    <h1>📝 毛概智能刷题</h1>

    <div id="loading-msg">正在读取题库...</div>

    <div id="error-msg">
        <h3>⚠️ 未找到题库文件</h3>
        <p>请确保 <b>question_data.js</b> 文件存在，且与本 HTML 文件在同一目录下。</p>
        <p>请先运行 Python 脚本生成该文件。</p>
    </div>

    <div id="main-interface" style="display:none;">
        <div class="control-bar">
            <select id="type-filter" onchange="initQuiz()" aria-label="题型筛选">
                <option value="all">全部题型</option>
                <option value="单选">单选题</option>
                <option value="多选">多选题</option>
                <option value="判断">判断题</option>
            </select>
            <select id="review-filter" onchange="initQuiz()" aria-label="练习范围">
                <option value="all">随机练习</option>
                <option value="wrong">只练错题</option>
            </select>
            <button class="btn btn-refresh" onclick="initQuiz()">🔄 换一批题</button>
        </div>
        <div id="quiz-area"></div>
        <div style="text-align: center; margin-top: 30px;">
            <button class="btn btn-refresh" onclick="window.scrollTo(0,0); initQuiz()">再来一套</button>
        </div>
    </div>
</div>

<div class="score-board" id="score-board">
    <div><b>答题统计</b></div>
    <hr style="margin: 5px 0; border:0; border-top:1px solid #eee;">
    <div>已答：<span id="answered-count">0</span> / <span id="question-count">0</span></div>
    <div>正确：<span id="correct-count" style="color:green">0</span></div>
    <div>错误：<span id="wrong-count" style="color:red">0</span></div>
</div>

<script>
    // 全局变量
    let currentQuestions = [];
    let stats = { answered: 0, correct: 0, wrong: 0 };
    const STORE_KEY = 'hive.study.maogai.progress.v1';
    let studyProgress = loadProgress();

    function loadProgress() {
        try { return JSON.parse(localStorage.getItem(STORE_KEY)) || { attempts: 0, correct: 0, wrongIds: [] }; }
        catch (_) { return { attempts: 0, correct: 0, wrongIds: [] }; }
    }

    function questionId(question) {
        let hash = 2166136261;
        for (const char of `${question.type}:${question.title}`) hash = Math.imul(hash ^ char.charCodeAt(0), 16777619);
        return (hash >>> 0).toString(36);
    }

    function saveProgress() { localStorage.setItem(STORE_KEY, JSON.stringify(studyProgress)); }

    // 1. 初始化检查
    window.onload = function() {
        const loading = document.getElementById('loading-msg');
        const error = document.getElementById('error-msg');
        const main = document.getElementById('main-interface');
        const scoreBoard = document.getElementById('score-board');

        // 检查 Python 生成的全局变量是否存在
        if (typeof window.QUESTION_BANK !== 'undefined' && Array.isArray(window.QUESTION_BANK)) {
            loading.style.display = 'none';
            main.style.display = 'block';
            scoreBoard.style.display = 'block';
            initQuiz();
        } else {
            loading.style.display = 'none';
            error.style.display = 'block';
        }
    };

    // 2. 抽题逻辑
    function initQuiz() {
        // 重置统计
        stats = { answered: 0, correct: 0, wrong: 0 };
        updateScoreBoard();

        const typeFilter = document.getElementById('type-filter').value;
        const reviewFilter = document.getElementById('review-filter').value;
        let allData = window.QUESTION_BANK.filter(q => typeFilter === 'all' || q.type === typeFilter);
        if (reviewFilter === 'wrong') {
            const wrong = new Set(studyProgress.wrongIds);
            allData = allData.filter(q => wrong.has(questionId(q)));
        }

        // 分类
        const singles = allData.filter(q => q.type === '单选');
        const multis = allData.filter(q => q.type === '多选');
        const judges = allData.filter(q => q.type === '判断');

        // 随机抽取 (洗牌算法)
        function shuffle(arr) {
            const result = arr.slice();
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        // 如果题目不够，则全部取出
        const selectedSingles = shuffle(singles).slice(0, 15);
        const selectedMultis = shuffle(multis).slice(0, 15);
        const selectedJudges = shuffle(judges).slice(0, 15);

        // 合并
        currentQuestions = [...selectedSingles, ...selectedMultis, ...selectedJudges];
        currentQuestions = shuffle(currentQuestions);

        renderQuestions();
    }

    // 3. 渲染题目
    function renderQuestions() {
        const area = document.getElementById('quiz-area');
        area.innerHTML = '';

        if (currentQuestions.length === 0) {
            area.innerHTML = '<p style="text-align:center">题库为空，请检查数据。</p>';
            return;
        }

        currentQuestions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.dataset.answer = q.answer; // 存储正确答案
            card.dataset.type = q.type;
            card.dataset.questionId = questionId(q);

            // 题型标签颜色
            let tagClass = 'tag-single';
            if (q.type === '多选') tagClass = 'tag-multi';
            if (q.type === '判断') tagClass = 'tag-judge';

            // 构建 HTML
            let html = `
                <div class="q-title">
                    <span class="type-tag ${tagClass}">${q.type}</span>
                    ${index + 1}. ${q.title}
                </div>
                <div class="options-group">
            `;

            // 渲染选项
            if (q.type === '判断') {
                html += `
                    <div class="option-item" onclick="handleOptionClick(this, '正确')">✔️ 正确</div>
                    <div class="option-item" onclick="handleOptionClick(this, '错误')">❌ 错误</div>
                `;
            } else {
                ['A', 'B', 'C', 'D'].forEach(key => {
                    if (q.options[key]) {
                        html += `
                            <div class="option-item" onclick="handleOptionClick(this, '${key}')">
                                <span style="font-weight:bold; width:25px;">${key}.</span> ${q.options[key]}
                            </div>
                        `;
                    }
                });
            }

            html += `</div>`;

            // 多选需要提交按钮
            if (q.type === '多选') {
                html += `<button class="btn btn-submit" onclick="submitMulti(this)">确认答案</button>`;
            }

            // 反馈区域
            html += `<div class="feedback"></div>`;

            card.innerHTML = html;
            area.appendChild(card);
        });
    }

    // 4. 交互逻辑

    // 点击选项 (单选/判断/多选的选中)
    window.handleOptionClick = function(el, value) {
        const card = el.closest('.question-card');
        const type = card.dataset.type;

        // 如果已答题(单选/判断)，或者是多选已提交，则禁止操作
        if (card.classList.contains('answered')) return;

        if (type === '多选') {
            // 多选：切换选中状态
            el.classList.toggle('selected');
        } else {
            // 单选/判断：直接提交
            card.classList.add('answered');
            checkAnswer(card, value, el);
        }
    };

    // 提交多选
    window.submitMulti = function(btn) {
        const card = btn.closest('.question-card');
        if (card.classList.contains('answered')) return;

        // 获取所有选中的选项
        const selectedEls = card.querySelectorAll('.option-item.selected');
        const userAns = Array.from(selectedEls).map(el => {
            // 提取选项 A, B...
            return el.innerText.trim().charAt(0);
        }).sort().join('');

        if (userAns.length === 0) return; // 未选任何项

        card.classList.add('answered');
        btn.style.display = 'none'; // 隐藏按钮

        checkAnswer(card, userAns, null);
    };

    // 核心判题函数
    function checkAnswer(card, userAns, clickedEl) {
        const correctAns = card.dataset.answer;
        const feedback = card.querySelector('.feedback');
        const type = card.dataset.type;
        const options = card.querySelectorAll('.option-item');

        let isCorrect = (userAns === correctAns);
        const questionId = card.dataset.questionId;
        const wrongIds = new Set(studyProgress.wrongIds);
        studyProgress.attempts++;

        stats.answered++;

        if (isCorrect) {
            stats.correct++;
            studyProgress.correct++;
            wrongIds.delete(questionId);
            feedback.innerHTML = `✅ <b>回答正确！</b>`;
            feedback.style.color = 'green';
            feedback.style.display = 'block';

            // 高亮正确项
            if (type === '多选') {
                options.forEach(opt => {
                    if (opt.classList.contains('selected')) opt.classList.add('correct');
                });
            } else {
                if(clickedEl) clickedEl.classList.add('correct');
            }

        } else {
            stats.wrong++;
            wrongIds.add(questionId);
            feedback.innerHTML = `❌ <b>回答错误</b><br>正确答案：<b>${correctAns}</b>`;
            feedback.style.color = '#d9534f';
            feedback.style.display = 'block';

            // 样式处理
            if (type === '多选') {
                options.forEach(opt => {
                    if (opt.classList.contains('selected')) opt.classList.add('wrong');
                });
            } else {
                if(clickedEl) clickedEl.classList.add('wrong');
            }

            // 标出正确答案 (绿色高亮)
            if (type === '判断') {
                options.forEach(opt => {
                    if (opt.innerText.includes(correctAns === '正确' ? '✔️' : '❌')) {
                        opt.classList.add('correct');
                    }
                });
            } else {
                // 单选/多选 标出所有包含在正确答案里的选项
                options.forEach(opt => {
                    const letter = opt.innerText.trim().charAt(0);
                    if (correctAns.includes(letter)) {
                        opt.classList.add('correct');
                    }
                });
            }
        }
        studyProgress.wrongIds = Array.from(wrongIds);
        saveProgress();
        updateScoreBoard();
    }

    function updateScoreBoard() {
        document.getElementById('answered-count').innerText = stats.answered;
        document.getElementById('correct-count').innerText = stats.correct;
        document.getElementById('wrong-count').innerText = stats.wrong;
        document.getElementById('question-count').innerText = currentQuestions.length;
    }

</script>

</body>
</html>
